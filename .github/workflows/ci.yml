name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be re-run from the Actions tab without inventing a commit.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build dashboard
        run: npm run build --workspace @foundershield/dashboard
        env:
          # Placeholders: the build must not depend on real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-key

  deploy-edge:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `secrets` context is not available in `if` expressions anywhere,
    # including at step level. Binding it to `env` here is the supported way to
    # branch on whether a secret has been configured.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Skipped rather than failed while Cloudflare credentials are absent. A
      # permanently red CI badge teaches everyone to ignore CI, which costs
      # more than the missing deploy does.
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/edge

      - name: Note missing credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set - skipping deploy. Add it in Settings > Secrets to enable."
